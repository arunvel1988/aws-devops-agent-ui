events {}

http {

    # ==========================================
    # Validate Bearer Token
    # ==========================================

    map $http_authorization $valid_mcp_token {

        default 0;

        "Bearer my-super-secret-mcp-key" 1;
    }


    # ==========================================
    # MCP Backend
    # ==========================================

    upstream rag_mcp {

        server rag-mcp:8080;
    }


    # ==========================================
    # NGINX SERVER
    # ==========================================

    server {

        listen 80;

        server_name _;


        # ======================================
        # MCP Endpoint
        # ======================================

        location /mcp {

            # ------------------------------
            # Authentication
            # ------------------------------

            if ($valid_mcp_token = 0) {

                return 401;
            }


            # ------------------------------
            # Forward to MCP
            # ------------------------------

            proxy_pass http://rag_mcp;

            proxy_http_version 1.1;


            # ------------------------------
            # Headers
            # ------------------------------

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Authorization $http_authorization;


            # ------------------------------
            # MCP Streaming
            # ------------------------------

            proxy_buffering off;

            proxy_cache off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;

            proxy_set_header Connection "";
        }
    }
}
