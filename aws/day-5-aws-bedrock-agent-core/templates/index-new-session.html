<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS DevOps Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #212121;
            color: #ececec;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 18px;
            font-weight: 600;
        }

        #newSession {
            width: auto;
            height: 36px;
            padding: 0 14px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #333;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        #newSession:hover {
            background: #444;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 120px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
            gap: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #444;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: bold;
        }

        .user .avatar {
            background: #555;
        }

        .assistant .avatar {
            background: #666;
        }

        .content {
            flex: 1;
            padding-top: 4px;
        }

        .session-separator {
            max-width: 850px;
            margin: 35px auto;
            text-align: center;
            color: #777;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, #212121 20%);
            padding: 25px 20px 20px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: #2f2f2f;
            border: 1px solid #555;
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            padding: 10px;
            min-height: 45px;
            max-height: 180px;
            font-family: inherit;
        }

        button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: #111;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="header">
        <div>AWS DevOps Agent</div>

        <button id="newSession" onclick="newSession()">
            New Session
        </button>
    </div>

    <div id="chat" class="chat-container">

        <div class="message assistant">
            <div class="avatar">AI</div>

            <div class="content">
                Hello. I'm your AWS DevOps Agent.
                How can I help you?
            </div>
        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="message"
                placeholder="Ask AWS DevOps Agent..."
                rows="1"
            ></textarea>

            <button id="send" onclick="sendMessage()">
                ↑
            </button>

        </div>

    </div>

<script>

    let sessionId =
        localStorage.getItem("agentcore_session_id");

    if (!sessionId) {
        sessionId = crypto.randomUUID();

        localStorage.setItem(
            "agentcore_session_id",
            sessionId
        );
    }


    function addMessage(text, type) {

        const chat =
            document.getElementById("chat");

        const message =
            document.createElement("div");

        message.className =
            "message " + type;

        const avatar =
            document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            type === "user" ? "YOU" : "AI";

        const content =
            document.createElement("div");

        content.className = "content";

        content.textContent = text;

        message.appendChild(avatar);
        message.appendChild(content);

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;

        return content;
    }


    function newSession() {

        /*
         * Keep all old messages visible.
         * Only change the AgentCore session ID.
         */

        sessionId = crypto.randomUUID();

        localStorage.setItem(
            "agentcore_session_id",
            sessionId
        );

        const chat =
            document.getElementById("chat");

        const separator =
            document.createElement("div");

        separator.className =
            "session-separator";

        separator.textContent =
            "──────── NEW SESSION ────────";

        chat.appendChild(separator);

        chat.scrollTop = chat.scrollHeight;

        document
            .getElementById("message")
            .focus();
    }


    async function sendMessage() {

        const textarea =
            document.getElementById("message");

        const button =
            document.getElementById("send");

        const message =
            textarea.value.trim();

        if (!message) {
            return;
        }

        addMessage(message, "user");

        textarea.value = "";

        button.disabled = true;

        const responseElement =
            addMessage(
                "Thinking...",
                "assistant"
            );

        responseElement.classList.add("typing");

        try {

            const response =
                await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: message,

                        session_id:
                            sessionId
                    })
                });


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Request failed"
                );
            }


            sessionId =
                data.session_id;


            localStorage.setItem(
                "agentcore_session_id",
                sessionId
            );


            responseElement.classList.remove(
                "typing"
            );


            let answer =
                data.response;


            if (typeof answer === "object") {

                if (answer.message) {

                    answer =
                        answer.message;

                } else {

                    answer =
                        JSON.stringify(
                            answer,
                            null,
                            2
                        );
                }
            }


            responseElement.textContent =
                answer;


        } catch (error) {

            responseElement.classList.remove(
                "typing"
            );

            responseElement.textContent =
                "Error: " + error.message;
        }


        button.disabled = false;

        textarea.focus();
    }


    document
        .getElementById("message")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );

</script>

</body>
</html>
