<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AWS DevOps Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #212121;
            color: #ececec;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 18px;
            font-weight: 600;
        }

        #newSession {
            width: auto;
            height: 36px;
            padding: 0 14px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #333;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        #newSession:hover {
            background: #444;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 120px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
            gap: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #444;
            flex-shrink: 0;
            font-size: 11px;
            font-weight: bold;
        }

        .user .avatar {
            background: #555;
        }

        .assistant .avatar {
            background: #666;
        }

        .content {
            flex: 1;
            padding-top: 4px;
        }

        .session-separator {
            max-width: 850px;
            margin: 35px auto;
            text-align: center;
            color: #777;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                transparent,
                #212121 20%
            );
            padding: 25px 20px 20px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: #2f2f2f;
            border: 1px solid #555;
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            padding: 10px;
            min-height: 45px;
            max-height: 180px;
            font-family: inherit;
        }

        #send {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: #111;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>


<body>

    <!-- ================================================= -->
    <!-- HEADER                                            -->
    <!-- ================================================= -->

    <div class="header">

        <div>
            AWS DevOps Agent
        </div>

        <button
            id="newSession"
            type="button"
        >
            New Session
        </button>

    </div>


    <!-- ================================================= -->
    <!-- CHAT                                              -->
    <!-- ================================================= -->

    <div
        id="chat"
        class="chat-container"
    >

        <div class="message assistant">

            <div class="avatar">
                AI
            </div>

            <div class="content">
                Hello. I'm your AWS DevOps Agent.
                How can I help you?
            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- INPUT                                             -->
    <!-- ================================================= -->

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="message"
                placeholder="Ask AWS DevOps Agent..."
                rows="1"
            ></textarea>

            <button
                id="send"
                type="button"
            >
                ↑
            </button>

        </div>

    </div>


<script>

    /* ================================================= */
    /* AGENTCORE SESSION                                 */
    /* ================================================= */

    let sessionId =
        localStorage.getItem(
            "agentcore_session_id"
        );


    /*
     * Create the first browser session
     * if one does not already exist.
     */

    if (!sessionId) {

        sessionId =
            crypto.randomUUID();

        localStorage.setItem(
            "agentcore_session_id",
            sessionId
        );
    }


    console.log(
        "CURRENT SESSION ID:",
        sessionId
    );


    /* ================================================= */
    /* ADD MESSAGE                                       */
    /* ================================================= */

    function addMessage(
        text,
        type
    ) {

        const chat =
            document.getElementById(
                "chat"
            );


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message " + type;


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        avatar.textContent =
            type === "user"
                ? "YOU"
                : "AI";


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "content";


        content.textContent =
            text;


        message.appendChild(
            avatar
        );


        message.appendChild(
            content
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;


        return content;
    }


    /* ================================================= */
    /* NEW SESSION                                       */
    /* ================================================= */

    async function newSession() {

        console.log(
            "NEW SESSION BUTTON CLICKED"
        );


        try {

            /*
             * Ask Flask to create
             * a new AgentCore session.
             */

            const response =
                await fetch(
                    "/new-session",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        }
                    }
                );


            console.log(
                "NEW SESSION STATUS:",
                response.status
            );


            const data =
                await response.json();


            console.log(
                "NEW SESSION RESPONSE:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Failed to create new session"
                );
            }


            /*
             * Replace the current
             * AgentCore runtime session.
             */

            sessionId =
                data.session_id;


            localStorage.setItem(
                "agentcore_session_id",
                sessionId
            );


            /*
             * Do NOT clear old messages.
             *
             * The UI keeps the history visible,
             * but all future requests use
             * the NEW AgentCore session ID.
             */

            const chat =
                document.getElementById(
                    "chat"
                );


            const separator =
                document.createElement(
                    "div"
                );


            separator.className =
                "session-separator";


            separator.textContent =
                "──────── NEW SESSION ────────";


            chat.appendChild(
                separator
            );


            chat.scrollTop =
                chat.scrollHeight;


            document
                .getElementById(
                    "message"
                )
                .focus();


            console.log(
                "NEW AGENTCORE SESSION ID:",
                sessionId
            );

        } catch (error) {

            console.error(
                "NEW SESSION ERROR:",
                error
            );


            alert(
                "New Session failed: " +
                error.message
            );
        }
    }


    /* ================================================= */
    /* SEND MESSAGE                                      */
    /* ================================================= */

    async function sendMessage() {

        const textarea =
            document.getElementById(
                "message"
            );


        const sendButton =
            document.getElementById(
                "send"
            );


        const message =
            textarea.value.trim();


        if (!message) {
            return;
        }


        /*
         * Display user's message.
         */

        addMessage(
            message,
            "user"
        );


        textarea.value = "";


        sendButton.disabled = true;


        /*
         * Temporary assistant message.
         */

        const responseElement =
            addMessage(
                "Thinking...",
                "assistant"
            );


        responseElement.classList.add(
            "typing"
        );


        try {

            /*
             * Send both:
             *
             * message
             * session_id
             *
             * to Flask.
             */

            const response =
                await fetch(
                    "/chat",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                session_id:
                                    sessionId

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Request failed"
                );
            }


            /*
             * Flask returns the
             * AgentCore session ID.
             */

            if (data.session_id) {

                sessionId =
                    data.session_id;


                localStorage.setItem(
                    "agentcore_session_id",
                    sessionId
                );
            }


            responseElement
                .classList.remove(
                    "typing"
                );


            let answer =
                data.response;


            /*
             * Handle JSON responses
             * safely.
             */

            if (
                typeof answer ===
                "object"
            ) {

                if (
                    answer.message
                ) {

                    answer =
                        answer.message;

                } else {

                    answer =
                        JSON.stringify(
                            answer,
                            null,
                            2
                        );
                }
            }


            responseElement.textContent =
                answer;


        } catch (error) {

            responseElement
                .classList.remove(
                    "typing"
                );


            responseElement.textContent =
                "Error: " +
                error.message;

        }


        sendButton.disabled = false;


        textarea.focus();
    }


    /* ================================================= */
    /* BUTTON EVENTS                                     */
    /* ================================================= */

    document
        .getElementById(
            "newSession"
        )
        .addEventListener(
            "click",
            newSession
        );


    document
        .getElementById(
            "send"
        )
        .addEventListener(
            "click",
            sendMessage
        );


    /* ================================================= */
    /* ENTER TO SEND                                     */
    /* SHIFT + ENTER = NEW LINE                          */
    /* ================================================= */

    document
        .getElementById(
            "message"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                    &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }

            }
        );

</script>


</body>

</html>
