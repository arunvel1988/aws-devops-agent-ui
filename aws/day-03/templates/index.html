<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS DevOps Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #212121;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           HEADER
        ================================================== */

        .header {
            height: 60px;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            margin-left: 15px;
            font-size: 12px;
            color: #8bc34a;
            font-weight: normal;
        }

        /* ==================================================
           MAIN
        ================================================== */

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .chat {
            width: 850px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ==================================================
           MESSAGES
        ================================================== */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px 10px;
        }

        .message {
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user {
            background: #2f2f2f;
        }

        .assistant {
            background: #1f1f1f;
        }

        .label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* ==================================================
           WELCOME
        ================================================== */

        .welcome {
            text-align: center;
            margin-top: 120px;
            color: #aaa;
        }

        .welcome h1 {
            color: white;
            font-size: 30px;
        }

        .welcome p {
            font-size: 16px;
        }

        /* ==================================================
           INPUT
        ================================================== */

        .input-area {
            padding: 15px 0 25px;
        }

        .input-box {
            display: flex;
            background: #2f2f2f;
            border: 1px solid #555;
            border-radius: 14px;
            padding: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            padding: 12px;
            font-size: 16px;
            height: 55px;
        }

        textarea::placeholder {
            color: #888;
        }

        button {
            width: 50px;
            height: 45px;
            border: none;
            border-radius: 9px;
            background: white;
            color: black;
            cursor: pointer;
            font-size: 20px;
            margin-top: 5px;
        }

        button:hover {
            background: #ddd;
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        /* ==================================================
           THINKING
        ================================================== */

        .thinking {
            color: #aaa;
        }

        .dots {
            display: inline-block;
            margin-left: 5px;
        }

        /* ==================================================
           TOOL ACTIVITY
        ================================================== */

        .tool-box {
            background: #292929;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
        }

        .tool-success {
            color: #8bc34a;
        }

        /* ==================================================
           HUMAN APPROVAL
        ================================================== */

        .approval-box {
            background: #292929;
            border: 1px solid #8b6f00;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .approval-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .approval-warning {
            color: #ffcc66;
            margin-bottom: 15px;
        }

        .approval-details {
            background: #1f1f1f;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: monospace;
            line-height: 1.8;
        }

        .approval-buttons {
            display: flex;
            gap: 10px;
        }

        .approve-button {
            width: auto;
            padding: 10px 20px;
            margin: 0;
            background: #8bc34a;
            color: #000;
            font-size: 14px;
        }

        .approve-button:hover {
            background: #9ccc65;
        }

        .reject-button {
            width: auto;
            padding: 10px 20px;
            margin: 0;
            background: #555;
            color: white;
            font-size: 14px;
        }

        .reject-button:hover {
            background: #666;
        }

        .action-result {
            margin-top: 15px;
            padding: 12px;
            background: #1f1f1f;
            border-radius: 8px;
            color: #aaa;
        }

        .action-success {
            color: #8bc34a;
        }

        .action-rejected {
            color: #ffcc66;
        }

        .action-error {
            color: #ff7777;
        }

        /* ==================================================
           SCROLLBAR
        ================================================== */

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: #212121;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }

        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 900px) {

            .chat {
                width: 95%;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <div class="header">

        AWS DevOps Agent

        <span class="status">
            ● Connected
        </span>

    </div>


    <!-- ==================================================
         CHAT
    ================================================== -->

    <div class="container">

        <div class="chat">

            <div id="messages">

                <!-- Welcome screen -->

                <div class="welcome" id="welcome">

                    <h1>AWS DevOps Agent</h1>

                    <p>
                        Investigate and troubleshoot your AWS infrastructure using AI.
                    </p>

                </div>

            </div>


            <!-- ==================================================
                 INPUT
            ================================================== -->

            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="message"
                        placeholder="Ask your DevOps agent..."
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        ↑
                    </button>

                </div>

            </div>

        </div>

    </div>


<script>


/* ==================================================
   ENTER KEY
================================================== */

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

    }

}


/* ==================================================
   SEND MESSAGE
================================================== */

async function sendMessage() {

    const input =
        document.getElementById("message");

    const button =
        document.getElementById("sendButton");

    const messages =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    /* Remove welcome screen */

    if (welcome) {

        welcome.remove();

    }


    /* Add user message */

    messages.innerHTML += `

        <div class="message user">

            <div class="label">
                You
            </div>

            ${escapeHtml(message)}

        </div>

    `;


    /* Clear input */

    input.value = "";


    /* Disable send button */

    button.disabled = true;


    /* ==================================================
       THINKING MESSAGE
    ================================================== */

    const thinkingId =
        "thinking-" + Date.now();


    messages.innerHTML += `

        <div
            class="message assistant thinking"
            id="${thinkingId}"
        >

            <div class="label">
                AWS DevOps Agent
            </div>

            <div class="tool-box">

                Investigating your AWS environment...

            </div>

        </div>

    `;


    scrollToBottom();


    try {

        /* ==================================================
           CALL FLASK
        ================================================== */

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    message: message

                })

            });


        const data =
            await response.json();


        /* Remove thinking message */

        const thinking =
            document.getElementById(thinkingId);


        if (thinking) {

            thinking.remove();

        }


        /* ==================================================
           ERROR
        ================================================== */

        if (data.error) {

            messages.innerHTML += `

                <div class="message assistant">

                    <div class="label">
                        AWS DevOps Agent
                    </div>

                    <div class="action-error">

                        ${escapeHtml(data.error)}

                    </div>

                </div>

            `;

        }


        /* ==================================================
           AGENT RESPONSE
        ================================================== */

        else {

            messages.innerHTML += `

                <div class="message assistant">

                    <div class="label">
                        AWS DevOps Agent
                    </div>

                    ${formatResponse(data.answer)}

                </div>

            `;


            /* ==================================================
               CHECK FOR HUMAN APPROVAL
            ================================================== */

            if (data.approval_required === true) {

                showApprovalBox(

                    data.instance_id,

                    data.pid,

                    data.process_name,

                    data.cpu

                );

            }

        }

    }


    catch (error) {

        const thinking =
            document.getElementById(thinkingId);


        if (thinking) {

            thinking.innerHTML = `

                <div class="label">
                    AWS DevOps Agent
                </div>

                <div class="tool-box">

                    Unable to connect to the agent.

                </div>

            `;

        }

    }


    /* Enable send button */

    button.disabled = false;


    input.focus();


    scrollToBottom();

}


/* ==================================================
   HUMAN APPROVAL BOX
================================================== */

function showApprovalBox(
    instanceId,
    pid,
    processName,
    cpu
) {

    const messages =
        document.getElementById("messages");


    const approvalId =
        "approval-" + Date.now();


    messages.innerHTML += `

        <div
            class="message assistant"
            id="${approvalId}"
        >

            <div class="approval-box">

                <div class="approval-title">

                    HUMAN APPROVAL REQUIRED

                </div>


                <div class="approval-warning">

                    The agent recommends terminating
                    the following process.

                </div>


                <div class="approval-details">

                    Instance:
                    ${escapeHtml(instanceId)}

                    <br>

                    PID:
                    ${escapeHtml(String(pid))}

                    <br>

                    Process:
                    ${escapeHtml(processName || "unknown")}

                    <br>

                    CPU:
                    ${escapeHtml(String(cpu || "unknown"))}%

                </div>


                <div class="approval-warning">

                    Do you want the agent to terminate
                    this process?

                </div>


                <div class="approval-buttons">

                    <button
                        class="approve-button"
                        onclick="approveAction(
                            '${escapeJs(instanceId)}',
                            ${Number(pid)},
                            '${escapeJs(processName || "")}',
                            '${approvalId}'
                        )"
                    >

                        YES - TERMINATE

                    </button>


                    <button
                        class="reject-button"
                        onclick="rejectAction(
                            '${approvalId}'
                        )"
                    >

                        NO - CANCEL

                    </button>

                </div>

            </div>

        </div>

    `;


    scrollToBottom();

}


/* ==================================================
   APPROVE ACTION
================================================== */

async function approveAction(
    instanceId,
    pid,
    processName,
    approvalId
) {

    const box =
        document.getElementById(approvalId);


    if (!box) {

        return;

    }


    /* Disable both buttons */

    const buttons =
        box.querySelectorAll("button");


    buttons.forEach(function(button) {

        button.disabled = true;

    });


    try {

        /* ==================================================
           SEND APPROVAL TO FLASK
        ================================================== */

        const response =
            await fetch(

                "/approve-action",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        approved: true,

                        instance_id:
                            instanceId,

                        pid:
                            pid

                    })

                }

            );


        const data =
            await response.json();


        /* ==================================================
           ACTION ERROR
        ================================================== */

        if (data.error) {

            box.innerHTML += `

                <div class="action-result action-error">

                    Action failed:

                    ${escapeHtml(data.error)}

                </div>

            `;

        }


        /* ==================================================
           ACTION SUCCESS
        ================================================== */

        else {

            box.innerHTML += `

                <div class="action-result action-success">

                    Action executed.

                    <br><br>

                    PID ${escapeHtml(String(pid))}
                    termination command was sent
                    through AWS Systems Manager.

                </div>

            `;

        }

    }


    catch (error) {

        box.innerHTML += `

            <div class="action-result action-error">

                Unable to execute the remediation action.

            </div>

        `;

    }


    scrollToBottom();

}


/* ==================================================
   REJECT ACTION
================================================== */

function rejectAction(approvalId) {

    const box =
        document.getElementById(approvalId);


    if (!box) {

        return;

    }


    /* Disable buttons */

    const buttons =
        box.querySelectorAll("button");


    buttons.forEach(function(button) {

        button.disabled = true;

    });


    /* Show cancellation */

    box.innerHTML += `

        <div class="action-result action-rejected">

            Action cancelled by human.

            <br><br>

            No changes were made to the EC2 instance.

        </div>

    `;

}


/* ==================================================
   FORMAT AGENT RESPONSE
================================================== */

function formatResponse(text) {

    if (!text) {

        return "";

    }


    return escapeHtml(text)

        .replace(
            /\n/g,
            "<br>"
        )

        .replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

}


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* ==================================================
   JAVASCRIPT ESCAPE
================================================== */

function escapeJs(text) {

    return String(text)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        );

}


/* ==================================================
   SCROLL TO BOTTOM
================================================== */

function scrollToBottom() {

    const messages =
        document.getElementById("messages");


    messages.scrollTop =
        messages.scrollHeight;

}


</script>

</body>

</html>
